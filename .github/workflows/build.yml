name: Build USVFS

on:
  push:
    branches:
      - master
      - "async-read-prefetch*"
      - harness
  pull_request:
    types: [opened, synchronize, reopened]

# fork: 0.5.7.2 is built with CMake + vcpkg (no Azure binary cache); x64 only
env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

jobs:
  build:
    name: Build and test USVFS (x64 Release)
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64]
        config: [Release]
    steps:
      - name: "Set environmental variables"
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - run: cmake --preset vs2022-windows-${{ matrix.arch }} -B build_${{ matrix.arch }}

      # builds everything including the tests (preset enables BUILD_TESTING)
      - run: cmake --build build_${{ matrix.arch }} --config ${{ matrix.config }}

      # fork: the Release DLL is what gets installed for testing
      - uses: actions/upload-artifact@v4
        with:
          name: usvfs-release_${{ matrix.arch }}
          path: |
            ./lib
            ./bin

      # harness: file-API trace replayer
      - uses: actions/upload-artifact@v4
        with:
          name: replay_${{ matrix.arch }}
          path: ./bin/replay_${{ matrix.arch }}.exe

      - run: ./test/bin/shared_test_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/testinject_bin_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/thooklib_test_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/tinjectlib_test_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/tvfs_test_${{ matrix.arch }}.exe
        if: always()
      # the fork only builds x64: skip the scenarios that spawn x86 binaries
      - run: ./test/bin/usvfs_test_runner_${{ matrix.arch }}.exe --gtest_filter=-UsvfsTest.basic_x86:UsvfsTest.basic_ops32_x64:UsvfsTest.basic_ops64_x86
        if: always()
      - run: ./test/bin/usvfs_global_test_runner_${{ matrix.arch }}.exe
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-outputs_${{ matrix.arch }}
          path: ./test/temp
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
